# Test-scope configuration. See the note in any service repo: this REPLACES
# src/main/resources/application.properties rather than merging with it.

spring.application.name=configserver
server.port=0

# clone-on-start is true in src/main, because a config server that cannot reach
# its backing repository should never report healthy. Here that would make every
# build depend on GitHub being reachable, and would be the one place a token
# could be demanded of CI. Point at a path that does not exist and leave the
# clone off - the context still starts, which is all contextLoads() asserts.
spring.cloud.config.server.git.uri=file:///${java.io.tmpdir}/homecrew-config-absent
spring.cloud.config.server.git.clone-on-start=false
spring.cloud.config.server.git.username=
spring.cloud.config.server.git.password=

eureka.client.enabled=false

management.endpoint.health.show-details=always
