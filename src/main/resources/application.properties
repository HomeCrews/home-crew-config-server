server.port=8888

spring.application.name=configserver

spring.config.import=optional:file:.env[.properties]

# Decryption of {cipher} values before they are served.
#
# spring.cloud.config.server.encrypt.enabled already defaults to true - "Enable
# decryption of environment properties before sending to client" - so it is not
# restated here. A property whose only effect is to repeat a default is one
# somebody later edits believing it does something.
#
# NOTHING here needs spring-security-rsa. A symmetric key goes through
# EncryptionBootstrapConfiguration$VanillaEncryptionConfiguration, and
# spring-security-crypto is already a compile dependency of
# spring-cloud-config-server. spring-security-rsa is the keystore path only.
#
# THE FAILURE MODE HERE IS SILENT, which is why RequiredSecrets exists.
# CipherEnvironmentEncryptor does not throw when a value will not decrypt: it
# has a prefixInvalidProperties flag and RENAMES the property to
# invalid.<key>, so the client receives no property at all rather than a wrong
# one, and the only trace is a single WARN in this server's log. encrypt.key
# being wrong therefore looks exactly like the key not being referenced.
#
# encrypt.fail-on-error does NOT guard this. It lives on KeyProperties in
# spring-cloud-context's bootstrap.encrypt package and is read by
# AbstractEnvironmentDecrypt - the CLIENT-side decryptor. It has no effect on
# what this server serves.
encrypt.key=${ENCRYPT_KEY}

# A PBKDF2 salt, not a secret: the framework default "deadbeef" is published in
# the documentation, which is the only reason this is not it. Deliberately a
# literal and NOT an environment variable.
#
# NEVER CHANGE THIS VALUE. Changing it makes every existing {cipher} value in
# home-crew-config permanently undecryptable, and per the note above the symptom
# is a renamed invalid.<key> property rather than an error. Rotate encrypt.key
# and re-encrypt instead. Must stay even-length hex - AesBytesEncryptor calls
# Hex.decode on it.
encrypt.salt=7a1f3c9e5b2d8046

spring.cloud.config.server.git.uri=https://github.com/HomeCrews/home-crew-config.git

# REQUIRED unless home-crew-config is public. GitCredentialsProviderFactory
# installs a CredentialsProvider only when StringUtils.hasText(username), so an
# empty username means no provider at all - and against a private repo JGit then
# fails with:
#
#   Authentication is required but no CredentialsProvider has been registered
#
# which reads like a missing library rather than a missing password. The empty
# default is kept deliberately, because that message is clearer than sending the
# literal string ${CONFIG_GIT_USERNAME} as a username and getting a 401.
#
# Set both in .env (locally) and as GitHub secrets (deployed). A read-only
# classic PAT with the `repo` scope, or a fine-grained token with Contents:read
# on home-crew-config, is enough.
spring.cloud.config.server.git.username=${CONFIG_GIT_USERNAME:}
spring.cloud.config.server.git.password=${CONFIG_GIT_TOKEN:}

# home-crew-config's default branch is main, unlike the service repos. Pin it
# rather than relying on the implicit default, and turn OFF the master
# fallback: try-master-branch defaults to true, so a typo'd label silently
# retries "master", which does not exist, and you debug a 404 chain instead of
# reading "unknown label".
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.try-master-branch=false

# The highest-value line in this file. Without it the clone is lazy, so a bad
# URI or a dead token is discovered on the FIRST CLIENT REQUEST - during the
# rollout of eleven services, not at config-server boot. With it the context
# fails, the container never reports healthy, and every depends_on
# service_healthy in docker-compose.yml refuses to start. One red container
# instead of a diffuse outage.
#
# This is also what would break ConfigserverApplicationTests, which is why
# src/test/resources/application.properties turns it back off.
spring.cloud.config.server.git.clone-on-start=true

# A fixed path rather than a random temp directory, so
#   docker exec homecrew-config-server ls -R /var/tmp/homecrew-config
# shows what was actually cloned rather than what you hoped was.
spring.cloud.config.server.git.basedir=/var/tmp/homecrew-config
spring.cloud.config.server.git.timeout=10

# NOT 0. JGitEnvironmentRepository gates its fetch on shouldPull(), which
# compares lastRefresh against refreshRate - so 0 means a network round trip to
# GitHub on EVERY request, including every healthcheck probe.
#
# That is what made this container intermittently unhealthy. The compose probe
# allowed curl 3s while git.timeout below allows 10s just to obtain the HTTP
# connection, so the probe was given less time than the operation it was probing
# is permitted to take. Add ten clients each triggering their own fetch during a
# converge and roughly one deploy in five saw twenty consecutive probe timeouts
# and flipped the container to unhealthy - while config-server was behaving
# exactly as configured.
#
# 30s keeps the original property: a push to home-crew-config is still picked up
# without restarting this server, just within 30 seconds rather than instantly.
# clone-on-start=true means a restart always begins from a fresh clone anyway.
spring.cloud.config.server.git.refresh-rate=30

# The cure for "working and completely broken are indistinguishable". Default
# true: an application the repo knows nothing about returns 200 with an empty
# propertySources array, which is exactly what this server did for its whole
# existence before the config repo had content. With false it returns 404, so
# curl and the client can tell "served nothing" from "served something".
spring.cloud.config.server.accept-empty=false

# Make the compose healthcheck mean something. The default health indicator
# probes application/default; pinning name, profile and label makes it ask for
# the same thing a client will.
spring.cloud.config.server.health.repositories.homecrew.name=application
spring.cloud.config.server.health.repositories.homecrew.profiles=container
spring.cloud.config.server.health.repositories.homecrew.label=main

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# health and info only. Never add env or configprops here: on a config-driven
# system /actuator/env prints every resolved value, including
# spring.datasource.password, on a port currently published to 0.0.0.0.
# HTTP basic on everything except the health endpoint - see SecurityConfig for
# why that exception is load-bearing. This server now hands out DECRYPTED
# secrets, so an unauthenticated /decrypt or /userservice/container would give away
# every credential in home-crew-config to anyone who can reach port 8888.
spring.security.user.name=configclient
spring.security.user.password=${CONFIG_CLIENT_PASSWORD}

management.endpoints.web.exposure.include=health,info
# when-authorized, not always. /actuator/health is the ONE endpoint SecurityConfig
# leaves open, because docker-compose.yml health-checks it with no credentials.
# ConfigServerHealthIndicator's details include the git URI and the files it
# found, so an anonymous caller now gets a bare {"status":"UP"} and an
# authenticated one gets the rest. The healthcheck only needs the 200.
management.endpoint.health.show-details=when-authorized
