name: CI/CD

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build and test
        run: ./mvnw clean verify

  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build

    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build application
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker image tag
        id: meta
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        run: |
          docker build \
            -t mthanuj/homecrew-config-server:${{ steps.meta.outputs.tag }} \
            -t mthanuj/homecrew-config-server:sha-${GITHUB_SHA::7} \
            .

      - name: Push Docker image
        run: |
          docker push mthanuj/homecrew-config-server:${{ steps.meta.outputs.tag }}
          docker push mthanuj/homecrew-config-server:sha-${GITHUB_SHA::7}

      - name: Trigger infrastructure deployment
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -e

          echo "Triggering infrastructure deployment..."

          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/homecrews/home-crew-infrastructure/dispatches \
            -d '{
              "event_type": "service-image-updated",
              "client_payload": {
                "service": "config-server",
                "image": "mthanuj/homecrew-config-server",
                "tag": "dev",
                "sha": "${{ github.sha }}"
              }
            }'
